
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/Fitness-MicroService-Users
    username: postgres
    password: Adity@007
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: true
  instance:
    instance-id: ${spring.application.name}:${server.port}
    appname: ${spring.application.name}









